<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friendly Speed Insights</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
      line-height: 1.6;
    }

    .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }

    .header { text-align: center; margin-bottom: 40px; color: white; }
    .header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 10px; }
    .subtitle { font-size: 1rem; opacity: 0.9; }

    .input-section {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      margin-bottom: 30px;
    }

    .input-wrapper { display: flex; gap: 12px; }

    #url-input {
      flex: 1;
      padding: 16px 20px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
    }

    #url-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
    }

    #analyze-btn {
      padding: 16px 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    #analyze-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102,126,234,0.4);
    }

    #analyze-btn:disabled { opacity: 0.7; cursor: not-allowed; }

    .loading-section {
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 16px;
      margin-bottom: 30px;
    }

    .spinner {
      width: 60px; height: 60px;
      border: 4px solid #e0e0e0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { color: #666; }
    .loading-text small { color: #999; }

    .error-box {
      background: #fff5f5;
      border: 2px solid #ff4e42;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 30px;
    }

    .error-message { color: #c53030; font-weight: 500; }

    /* スコアカード - 2列表示 */
    .scores-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .score-card {
      background: white;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    .device-label {
      font-size: 14px;
      color: #666;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .device-icon { font-size: 20px; }

    .score-circle {
      width: 100px; height: 100px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      border: 6px solid;
    }

    .score-circle.score-good { border-color: #0cce6b; background: rgba(12,206,107,0.1); }
    .score-circle.score-average { border-color: #ffa400; background: rgba(255,164,0,0.1); }
    .score-circle.score-poor { border-color: #ff4e42; background: rgba(255,78,66,0.1); }

    .score-number { font-size: 32px; font-weight: 700; }

    .score-good .score-number { color: #0cce6b; }
    .score-average .score-number { color: #ffa400; }
    .score-poor .score-number { color: #ff4e42; }

    .score-description { font-size: 13px; color: #666; }

    /* タブ切り替え */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 14px;
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .tab-btn.active {
      background: white;
      color: #667eea;
    }

    .tab-btn:hover:not(.active) {
      background: rgba(255,255,255,0.3);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .savings-total {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
      font-size: 16px;
    }

    .savings-total strong { font-size: 20px; font-weight: 700; }

    .actions-title { color: white; font-size: 1.3rem; margin-bottom: 8px; }
    .actions-subtitle { color: rgba(255,255,255,0.8); margin-bottom: 15px; font-size: 13px; }

    .action-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .action-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .action-number {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      width: 24px; height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .action-title { flex: 1; font-weight: 600; font-size: 14px; color: #333; }

    .action-savings {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .action-description { color: #666; font-size: 13px; margin-bottom: 12px; line-height: 1.6; }

    .detail-btn {
      background: #f5f5f5;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      width: 100%;
    }

    .detail-btn:hover { background: #667eea; color: white; }

    .action-detail {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }

    .action-detail.open { display: block; }
    .action-detail strong { display: block; margin-bottom: 8px; color: #333; font-size: 13px; }

    .action-detail pre {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      font-family: inherit;
      color: #555;
    }

    .resource-list {
      margin-top: 12px;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
      font-size: 12px;
    }

    .resource-list strong {
      display: block;
      margin-bottom: 8px;
      color: #333;
    }

    .resource-list ul {
      margin: 0;
      padding-left: 20px;
      color: #666;
    }

    .resource-list li {
      margin-bottom: 4px;
      word-break: break-all;
    }

    .no-actions {
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      color: #0cce6b;
      font-weight: 500;
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: rgba(255,255,255,0.7);
      font-size: 12px;
    }

    .footer a { color: white; text-decoration: none; }

    @media (max-width: 600px) {
      .container { padding: 20px 16px; }
      .header h1 { font-size: 1.5rem; }
      .input-wrapper { flex-direction: column; }
      #analyze-btn { width: 100%; }
      .scores-container { grid-template-columns: 1fr; }
      .score-card { padding: 25px 15px; }
      .action-header { flex-wrap: wrap; }
      .action-savings { order: 3; width: 100%; text-align: center; margin-top: 6px; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Friendly Speed Insights</h1>
      <p class="subtitle">あなたのサイトの速度を診断し、改善点を分かりやすくお伝えします</p>
    </header>

    <section class="input-section">
      <form id="analyze-form">
        <div class="input-wrapper">
          <input type="url" id="url-input" placeholder="https://example.com" required>
          <button type="submit" id="analyze-btn">診断する</button>
        </div>
      </form>
    </section>

    <section class="loading-section hidden" id="loading">
      <div class="spinner"></div>
      <p class="loading-text">診断中です...<br><small>（20〜60秒ほどかかります）</small></p>
    </section>

    <div class="error-box hidden" id="error-section">
      <p class="error-message" id="error-message"></p>
    </div>

    <section class="hidden" id="result-section">
      <!-- スコア表示（2列） -->
      <div class="scores-container">
        <div class="score-card">
          <div class="device-label"><span class="device-icon">📱</span> モバイル</div>
          <div class="score-circle" id="mobile-score-circle">
            <span class="score-number" id="mobile-score-number">0</span>
          </div>
          <p class="score-description" id="mobile-score-desc"></p>
        </div>
        <div class="score-card">
          <div class="device-label"><span class="device-icon">💻</span> デスクトップ</div>
          <div class="score-circle" id="desktop-score-circle">
            <span class="score-number" id="desktop-score-number">0</span>
          </div>
          <p class="score-description" id="desktop-score-desc"></p>
        </div>
      </div>

      <!-- タブ切り替え -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="mobile">📱 モバイルの改善点</button>
        <button class="tab-btn" data-tab="desktop">💻 デスクトップの改善点</button>
      </div>

      <!-- モバイル改善点 -->
      <div class="tab-content active" id="tab-mobile">
        <div class="savings-total hidden" id="mobile-savings">
          <p>改善すると約 <strong id="mobile-savings-value">0</strong> 秒速くなります</p>
        </div>
        <h2 class="actions-title">改善ポイント</h2>
        <p class="actions-subtitle">効果が高い順に表示しています</p>
        <div id="mobile-action-list"></div>
      </div>

      <!-- デスクトップ改善点 -->
      <div class="tab-content" id="tab-desktop">
        <div class="savings-total hidden" id="desktop-savings">
          <p>改善すると約 <strong id="desktop-savings-value">0</strong> 秒速くなります</p>
        </div>
        <h2 class="actions-title">改善ポイント</h2>
        <p class="actions-subtitle">効果が高い順に表示しています</p>
        <div id="desktop-action-list"></div>
      </div>
    </section>

    <footer class="footer">
      <p>Powered by <a href="https://developers.google.com/speed/docs/insights/v5/about" target="_blank">Google PageSpeed Insights API</a></p>
    </footer>
  </div>

  <script>
    // 日本語翻訳辞書（補助的に使用、なければAPIのtitleを使う）
    const AUDIT_TRANSLATIONS = {
      'modern-image-formats': '次世代フォーマットで画像を配信',
      'uses-optimized-images': '画像を効率的にエンコード',
      'offscreen-images': 'オフスクリーン画像の遅延読み込み',
      'unused-javascript': '使用していないJavaScriptを削減',
      'unused-css-rules': '使用していないCSSを削減',
      'server-response-time': 'サーバー応答時間を短縮',
      'render-blocking-resources': 'レンダリングを妨げるリソースを排除',
      'unminified-javascript': 'JavaScriptを圧縮',
      'unminified-css': 'CSSを圧縮',
      'uses-responsive-images': '適切なサイズの画像を使用',
      'uses-text-compression': 'テキスト圧縮を有効化',
      'uses-rel-preconnect': '必要なオリジンへの事前接続',
      'uses-rel-preload': 'キーリクエストのプリロード',
      'font-display': 'フォント読み込み中のテキスト表示を確保',
      'unsized-images': '画像にwidth/heightを指定（CLSに影響）',
      'layout-shift-elements': 'レイアウトシフトを引き起こす要素',
      'largest-contentful-paint-element': 'LCPを遅らせる要素',
      'total-blocking-time': 'メインスレッドのブロッキング時間',
      'dom-size': 'DOM サイズを抑える',
      'bootup-time': 'JavaScript実行時間を短縮',
      'mainthread-work-breakdown': 'メインスレッド処理を最小化',
      'third-party-summary': 'サードパーティコードの影響を抑える',
      'legacy-javascript': 'レガシーJavaScriptを最新ブラウザに配信しない',
      'duplicated-javascript': '重複するJavaScriptを削減',
      'lcp-lazy-loaded': 'LCP画像に遅延読み込みを使わない',
      'prioritize-lcp-image': 'LCP画像の優先読み込み'
    };

    // DOM要素
    const form = document.getElementById('analyze-form');
    const urlInput = document.getElementById('url-input');
    const analyzeBtn = document.getElementById('analyze-btn');
    const loading = document.getElementById('loading');
    const errorSection = document.getElementById('error-section');
    const errorMessage = document.getElementById('error-message');
    const resultSection = document.getElementById('result-section');

    // タブ切り替え
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var tab = this.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
        document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
        this.classList.add('active');
        document.getElementById('tab-' + tab).classList.add('active');
      });
    });

    // フォーム送信
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var url = urlInput.value.trim();
      if (!url) return;

      hideResults();
      hideError();
      showLoading();
      analyzeBtn.disabled = true;

      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onError)
        .analyzeBoth(url);
    });

    function onSuccess(data) {
      hideLoading();
      analyzeBtn.disabled = false;

      if (data.error) {
        showError(data.error);
        return;
      }

      // モバイル結果
      if (data.mobile && !data.mobile.error) {
        displayScore('mobile', data.mobile);
        displayActions('mobile', data.mobile);
      }

      // デスクトップ結果
      if (data.desktop && !data.desktop.error) {
        displayScore('desktop', data.desktop);
        displayActions('desktop', data.desktop);
      }

      resultSection.classList.remove('hidden');
    }

    function onError(error) {
      hideLoading();
      analyzeBtn.disabled = false;
      showError('エラーが発生しました: ' + error.message);
    }

    function displayScore(device, data) {
      var score = extractScore(data);
      var circle = document.getElementById(device + '-score-circle');
      var number = document.getElementById(device + '-score-number');
      var desc = document.getElementById(device + '-score-desc');

      if (score === null) {
        number.textContent = '-';
        circle.className = 'score-circle';
        desc.textContent = 'スコア取得不可';
        return;
      }

      number.textContent = score;

      var colorClass, description;
      if (score >= 90) {
        colorClass = 'score-good';
        description = '高速';
      } else if (score >= 50) {
        colorClass = 'score-average';
        description = '改善余地あり';
      } else {
        colorClass = 'score-poor';
        description = '要改善';
      }

      circle.className = 'score-circle ' + colorClass;
      desc.textContent = description;
    }

    function displayActions(device, data) {
      var listEl = document.getElementById(device + '-action-list');
      var savingsEl = document.getElementById(device + '-savings');
      var savingsValueEl = document.getElementById(device + '-savings-value');

      listEl.innerHTML = '';
      var audits = filterAndSortAudits(data);

      if (audits.length === 0) {
        listEl.innerHTML = '<p class="no-actions">改善が必要な項目はありません！</p>';
        savingsEl.classList.add('hidden');
        return;
      }

      var totalMs = 0;
      audits.forEach(function(a) { totalMs += a.savingsMs; });
      savingsValueEl.textContent = (totalMs / 1000).toFixed(1);
      savingsEl.classList.remove('hidden');

      audits.forEach(function(audit, index) {
        // 日本語タイトル（翻訳があれば使う、なければAPIのtitle）
        var title = AUDIT_TRANSLATIONS[audit.id] || audit.title;

        // 効果の表示（時間またはサイズ）
        var savingsText = '';
        if (audit.savingsMs > 0) {
          savingsText = '-' + (audit.savingsMs / 1000).toFixed(1) + '秒';
        } else if (audit.savingsBytes > 0) {
          savingsText = '-' + Math.round(audit.savingsBytes / 1024) + 'KB';
        } else if (audit.displayValue) {
          savingsText = audit.displayValue;
        } else {
          savingsText = 'スコア: ' + Math.round(audit.score * 100);
        }

        // 問題のあるファイル一覧
        var itemsHtml = '';
        if (audit.items && audit.items.length > 0) {
          itemsHtml = '<div class="resource-list"><strong>対象ファイル:</strong><ul>';
          audit.items.forEach(function(item) {
            itemsHtml += '<li>' + escapeHtml(item) + '</li>';
          });
          itemsHtml += '</ul></div>';
        }

        var card = document.createElement('div');
        card.className = 'action-card';
        card.innerHTML = '<div class="action-header">' +
          '<span class="action-number">' + (index + 1) + '</span>' +
          '<span class="action-title">' + title + '</span>' +
          '<span class="action-savings">' + savingsText + '</span>' +
          '</div>' + itemsHtml;

        listEl.appendChild(card);
      });
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function extractScore(data) {
      var score = data.lighthouseResult?.categories?.performance?.score;
      return score !== undefined ? Math.round(score * 100) : null;
    }

    function filterAndSortAudits(data) {
      var audits = data.lighthouseResult?.audits || {};
      var filtered = [];

      // 全てのauditsをチェック
      Object.keys(audits).forEach(function(id) {
        var audit = audits[id];
        // スコアが1未満（問題あり）かつ、改善効果があるもの
        var hasIssue = audit.score !== null && audit.score < 1;
        var savingsMs = audit.details?.overallSavingsMs || 0;
        var savingsBytes = audit.details?.overallSavingsBytes || 0;

        // 改善効果があるか、スコアが悪いもの（0.5未満）
        if (hasIssue && (savingsMs > 0 || savingsBytes > 10000 || audit.score < 0.5)) {
          // 問題のあるリソース一覧を抽出
          var items = [];
          if (audit.details?.items) {
            audit.details.items.slice(0, 5).forEach(function(item) {
              var url = item.url || item.source?.url || '';
              if (url) {
                // URLからファイル名を抽出
                var filename = url.split('/').pop().split('?')[0] || url;
                if (filename.length > 50) filename = filename.substring(0, 47) + '...';

                var info = filename;
                // サイズ情報があれば追加
                if (item.totalBytes) {
                  info += ' (' + Math.round(item.totalBytes / 1024) + 'KB)';
                }
                if (item.wastedBytes) {
                  info += ' → ' + Math.round(item.wastedBytes / 1024) + 'KB削減可能';
                }
                if (item.wastedMs) {
                  info += ' → ' + (item.wastedMs / 1000).toFixed(1) + '秒短縮';
                }
                items.push(info);
              } else if (item.node?.snippet) {
                // HTML要素の場合
                var snippet = item.node.snippet;
                if (snippet.length > 60) snippet = snippet.substring(0, 57) + '...';
                items.push(snippet);
              }
            });
          }

          filtered.push({
            id: id,
            title: audit.title,
            description: audit.description,
            savingsMs: savingsMs,
            savingsBytes: savingsBytes,
            score: audit.score,
            displayValue: audit.displayValue,
            items: items
          });
        }
      });

      // 効果が高い順にソート（savingsMs優先、次にscore）
      filtered.sort(function(a, b) {
        if (b.savingsMs !== a.savingsMs) return b.savingsMs - a.savingsMs;
        return a.score - b.score;
      });

      return filtered.slice(0, 10); // 上位10件
    }

    function toggleDetail(btn) {
      var detail = btn.nextElementSibling;
      detail.classList.toggle('open');
      btn.textContent = detail.classList.contains('open') ? '閉じる' : '具体的なやり方を見る';
    }

    function showLoading() { loading.classList.remove('hidden'); }
    function hideLoading() { loading.classList.add('hidden'); }
    function showError(msg) { errorMessage.textContent = msg; errorSection.classList.remove('hidden'); }
    function hideError() { errorSection.classList.add('hidden'); }
    function hideResults() { resultSection.classList.add('hidden'); }
  </script>
</body>
</html>
